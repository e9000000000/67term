name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build
        shell: cmd
        run: call build.bat

      - name: Self-test
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/run-selftest.ps1

      - name: Check executable
        shell: pwsh
        run: |
          if (-not (Test-Path "build/67t.exe")) {
            throw "build/67t.exe was not produced"
          }
          $exe = Get-Item "build/67t.exe"
          "Built $($exe.FullName) ($($exe.Length) bytes)"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: 67t-windows-x64
          path: build/67t.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Latest build
          body: |
            Automated Windows x64 build.
            Commit: ${{ github.sha }}
          prerelease: true
          files: build/67t.exe
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Publish versioned release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: 67t ${{ github.ref_name }}
          generate_release_notes: true
          files: build/67t.exe
          overwrite_files: true
          fail_on_unmatched_files: true
